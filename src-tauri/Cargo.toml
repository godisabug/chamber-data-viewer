[package]
name = "app"
version = "0.1.0"
description = "Offline viewer for climate chamber temperature and humidity data"
authors = ["godisabug"]
license = "GPL-3.0-only"
repository = "https://github.com/godisabug/chamber-data-viewer"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1"
csv = "1"
flate2 = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
thiserror = "2"
